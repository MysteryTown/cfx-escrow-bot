name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Syntax check CLI & modules
        run: |
          node --check src/cli-escrow.js
          node --check src/escrow-resource.js
          node --check src/cfx-portal.js
          node --check src/bot.js

      - name: CLI help
        run: node src/cli-escrow.js --help

      - name: Test
        run: npm test
